name: V6 data model

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v61-data-model.yml'
      - 'V5/bw-v61-data-model.js'
      - 'V5/bw-v61-data-bridge.js'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V6 data model
        run: |
          node --check V5/bw-v61-data-model.js
          node --check V5/bw-v61-data-bridge.js
      - name: Load V6 data model before V5 enhancements
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="bw-v61-data-model.js" data-bw-v61="1"></script>',
            '<script src="bw-v61-data-bridge.js" data-bw-v61-bridge="1"></script>'
          ]
          marker='<script src="bw-v56-pin-enhancements.js"'
          pos=s.find(marker)
          if pos<0: pos=s.rfind('</body>')
          if pos<0: raise SystemExit('No insertion point found')
          for tag in reversed(tags):
              if tag not in s:
                  s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet || git commit -m 'V6 load canonical data model and bridge'
          git push
