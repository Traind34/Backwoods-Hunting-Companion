name: V6 recommendation integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v64-recommendation-integration.yml'
      - 'V5/bw-v63-today-loader.js'
      - 'V5/bw-v62-recommendation-engine.js'
      - 'V5/bw-v63-today.js'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V6 modules
        run: |
          node --check V5/bw-v62-recommendation-engine.js
          node --check V5/bw-v63-today.js
          node --check V5/bw-v63-today-loader.js
      - name: Load V6 recommendation loader into V5
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bw-v63-today-loader.js" data-bw-v63-loader="1"></script>'
          if tag not in s:
              marker='<script src="bw-v56-pin-enhancements.js"'
              pos=s.find(marker)
              if pos<0: raise SystemExit('V5 enhancement insertion point not found')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet || git commit -m 'V6 load recommendation engine'
          git push
