name: V8.6 canonical camera data bridge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v86-camera-data-bridge.yml'
      - 'V5/bw-v86-camera-data-bridge.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load camera bridge into app
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bw-v86-camera-data-bridge.js" data-bw-v86-camera-bridge="1"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos==-1:
                  raise SystemExit('No closing body tag')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit app patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add canonical camera data bridge'
          git push
