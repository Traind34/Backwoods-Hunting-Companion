name: V5.5 property map fullscreen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v55-property-fullscreen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fullscreen and hunting pin improvements
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('V5/index.html')
          s = p.read_text(encoding='utf-8')
          css = '\n/* V5.5 mobile Property map: header-free full viewport */\n@media(max-width:600px){body:has(#property.active) header{display:none!important}body:has(#property.active) main{padding:0!important;margin:0!important;max-width:none!important}body:has(#property.active) #property.active{top:0!important;bottom:74px!important}}\n'
          if 'V5.5 mobile Property map: header-free full viewport' not in s:
              pos=s.rfind('</style>')
              if pos<0: raise SystemExit('No closing style tag')
              s=s[:pos]+css+s[pos:]
          payload=base64.b64decode('''PHN0eWxlIGlkPSJidy12NTYtcGluLWRyYWctY3NzIj4KLmJ3UHJvcGVydHlQaW57dG91Y2gtYWN0aW9uOm5vbmU7dXNlci1zZWxlY3Q6bm9uZX0KLmJ3UHJvcGVydHlQaW4uYndEcmFnZ2luZ3tmaWx0ZXI6ZHJvcC1zaGFkb3coMCAz c==''') if False else None
          if 'bw-v56-pin-drag-js' not in s:
              encoded = """3932"""
              raise SystemExit('Payload placeholder not replaced')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'V5.6 improve hunting pin menu and draggable pins'; git push; fi
