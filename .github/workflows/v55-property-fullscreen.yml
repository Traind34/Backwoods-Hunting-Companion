name: V5.5 property map fullscreen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v55-property-fullscreen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile Property fullscreen fix and hunting pin improvements
        shell: python
        run: |
          from pathlib import Path
          p = Path('V5/index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
/* V5.5 mobile Property map: header-free full viewport */
@media(max-width:600px){
  body:has(#property.active) header{display:none!important}
  body:has(#property.active) main{padding:0!important;margin:0!important;max-width:none!important}
  body:has(#property.active) #property.active{top:0!important;bottom:74px!important}
}
'''
          marker = 'V5.5 mobile Property map: header-free full viewport'
          if marker not in s:
              pos = s.rfind('</style>')
              if pos == -1:
                  raise SystemExit('No closing style tag found')
              s = s[:pos] + css + s[pos:]
          pin_css = '''
<style id="bw-v56-pin-drag-css">
.bwPropertyPin{touch-action:none;user-select:none}
.bwPropertyPin.bwDragging{filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));transform:translate(-50%,-100%) scale(1.08)}
</style>
'''
          if 'bw-v56-pin-drag-css' not in s:
              s = s.replace('</head>', pin_css + '</head>', 1)
          drag_script = r'''
<script id="bw-v56-pin-drag-js">
(function(){
  function state(){try{return JSON.parse(localStorage.getItem("backwoods-planner-map-v5")||"{}")}catch(e){return {}}}
  function save(s){localStorage.setItem("backwoods-planner-map-v5",JSON.stringify(s))}
  function bind(){
    const O=document.querySelector("#bwMapOverlay"),V=document.querySelector("#bwMapViewport");
    if(!O||!V||O.dataset.v56drag==="1")return;
    O.dataset.v56drag="1";
    O.addEventListener("pointerdown",function(e){
      const el=e.target.closest(".bwPropertyPin"); if(!el)return;
      e.preventDefault(); e.stopPropagation();
      const st=state(), p=(st.pins||[]).find(x=>String(x.id)===String(el.dataset.pinId)); if(!p)return;
      const r=V.getBoundingClientRect(), sx=e.clientX, sy=e.clientY, start={lat:p.lat,lng:p.lng}, z=Number(st.zoom)||7, N=Math.pow(2,z);
      const X=lon=>(lon+180)/360*N, Y=lat=>(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*N;
      const LON=x=>x/N*360-180, LAT=y=>Math.atan(Math.sinh(Math.PI*(1-2*y/N)))*180/Math.PI;
      el.classList.add("bwDragging"); el.setPointerCapture?.(e.pointerId);
      const move=function(ev){
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        p.lng=LON(X(start.lng)+dx/256); p.lat=LAT(Y(start.lat)+dy/256);
        const cx=X(st.center.lng),cy=Y(st.center.lat);
        el.style.left=((X(p.lng)-cx)*256+r.width/2)+"px";
        el.style.top=((Y(p.lat)-cy)*256+r.height/2)+"px";
      };
      const up=function(){el.classList.remove("bwDragging");save(st);el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up)};
      el.addEventListener("pointermove",move); el.addEventListener("pointerup",up,{once:true});
    },true);
  }
  function tag(){const st=state();document.querySelectorAll("#bwMapOverlay .bwPropertyPin").forEach(function(el,i){if(!el.dataset.pinId&&st.pins&&st.pins[i])el.dataset.pinId=st.pins[i].id})}
  function addMenuItems(){
    const m=document.querySelector("#bwAddMenu"); if(!m)return;
    [["Trail Camera","Trail Camera"],["Other","Other"]].forEach(function(pair){
      if(m.querySelector('[data-add-type="'+pair[0]+'"]'))return;
      const b=document.createElement("button"); b.type="button"; b.setAttribute("data-add-type",pair[0]);
      b.innerHTML='<span class="bwMenuPin"></span>'+pair[1]; m.appendChild(b);
      b.addEventListener("click",function(){
        m.hidden=true;
        const box=document.querySelector("#bwPinPlacement"),title=document.querySelector("#bwPinPlacementTitle");
        if(title)title.textContent="Place "+pair[1]; if(box)box.hidden=false;
        window.__bwStartPinType=pair[0];
      });
    });
  }
  function run(){bind();tag();addMenuItems()}
  setInterval(run,500);
})();
</script>
'''
          if 'bw-v56-pin-drag-js' not in s:
              s = s.replace('</body>', drag_script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'V5.6 improve hunting pin menu and draggable pins'
            git push
          fi
