name: V5.5 property map fullscreen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v55-property-fullscreen.yml'
      - 'V5/bw-v56-pin-enhancements.js'
      - 'V5/bw-v57-layer-stack.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fullscreen and load V5.6/V5.7 enhancements
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          css='\n/* V5.5 mobile Property map: header-free full viewport */\n@media(max-width:600px){body:has(#property.active) header{display:none!important}body:has(#property.active) main{padding:0!important;margin:0!important;max-width:none!important}body:has(#property.active) #property.active{top:0!important;bottom:74px!important}}\n'
          if 'V5.5 mobile Property map: header-free full viewport' not in s:
              pos=s.rfind('</style>')
              if pos<0: raise SystemExit('No closing style tag')
              s=s[:pos]+css+s[pos:]
          for tag in [
              '<script src="bw-v56-pin-enhancements.js"></script>',
              '<script src="bw-v57-layer-stack.js"></script>'
          ]:
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'V5.7 enable satellite plus topographic layers'; git push; fi
