name: Backwoods V8.2 Cloud Sync
on:
  push:
    branches: [main]
    paths-ignore:
      - 'V5/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject cloud sync client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text()
          tag='<script src="bw-v82-cloud-sync.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no closing body tag')
              css='''<style id="bw-v82-cloud-sync-css">#bwCloudSyncPanel{margin-top:16px}.bwSyncCode{font-family:ui-monospace,monospace;letter-spacing:.12em}</style>'''
              s=s.replace(marker,css+'\n'+tag+'\n'+marker,1)
              p.write_text(s)
          PY
      - name: Commit injection
        run: |
          git config user.name 'Backwoods Cloud Sync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet || git commit -m 'Load Backwoods cloud sync client'
          git push
