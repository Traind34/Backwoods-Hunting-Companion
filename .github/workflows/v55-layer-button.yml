name: Backwoods V5.5 Layer Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-layer-button:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make map layer control visible on desktop and iPhone
        shell: python
        run: |
          from pathlib import Path
          p = Path('V5/index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing desktop control, but add a dedicated mobile control
          # inside the zoom-control stack. This avoids Safari/WebKit clipping of
          # the separate top-control container inside the fixed map viewport.
          marker = '<div id="bwMapZoomControls">'
          mobile = '<button type="button" id="bwMapLayersMobile" title="Map Layers" aria-label="Map Layers">LAYERS</button>'
          if 'id="bwMapLayersMobile"' not in s:
              if marker not in s:
                  raise SystemExit('Zoom controls not found')
              s = s.replace(marker, marker + '\n        ' + mobile, 1)

          css = '''\n/* V5.5 mobile Safari layer control */\n#bwMapLayersMobile{display:none!important;width:78px!important;height:42px!important;padding:0 8px!important;font-size:11px!important;letter-spacing:.08em!important;align-items:center!important;justify-content:center!important;touch-action:manipulation!important;-webkit-appearance:none!important}\n@media(max-width:600px){\n  #bwMapTopControls{display:none!important}\n  #bwMapZoomControls{top:10px!important;right:10px!important;z-index:100!important;gap:6px!important}\n  #bwMapZoomControls #bwMapLayersMobile{display:flex!important;position:relative!important;z-index:101!important}\n  #bwMapLayerPanel{top:60px!important;right:10px!important;z-index:120!important;width:230px!important;max-height:calc(100% - 80px)!important;overflow:auto!important}\n}\n'''
          style_end = '</style>'
          css_pos = s.find(style_end, s.find('<style id="bw-layer-map-css">'))
          if css_pos == -1:
              raise SystemExit('Map CSS block not found')
          if 'V5.5 mobile Safari layer control' not in s:
              s = s[:css_pos] + css + s[css_pos:]

          # Bind the mobile button to the exact same layer panel as desktop.
          old_bind = 'bind("#bwMapLayers",()=>$("#bwMapLayerPanel").hidden=!$("#bwMapLayerPanel").hidden);'
          new_bind = old_bind + '\nbind("#bwMapLayersMobile",()=>$("#bwMapLayerPanel").hidden=!$("#bwMapLayerPanel").hidden);'
          if 'bind("#bwMapLayersMobile"' not in s:
              if old_bind not in s:
                  raise SystemExit('Desktop layer binding not found')
              s = s.replace(old_bind, new_bind, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V5/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "V5.5 add dedicated iPhone map layers control"
            git push
          fi
