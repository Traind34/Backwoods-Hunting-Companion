name: Backwoods V5.5 Layer Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-layer-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make map layer control visible
        shell: python
        run: |
          from pathlib import Path
          p = Path('V5/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button type="button" id="bwMapLayers" title="Layers">☷</button>'
          new = '<button type="button" id="bwMapLayers" title="Map Layers" aria-label="Map Layers">LAYERS</button>'
          if old not in s:
              print('Layer button already patched; no change needed.')
              raise SystemExit(0)
          s = s.replace(old, new, 1)
          css = '''\n/* V5.5: make the map layer control unmistakable on phones */\n#bwMapTopControls #bwMapLayers{width:auto;min-width:78px;padding:0 10px;font-size:11px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center}\n'''
          marker = '</style>'
          pos = s.find(marker, s.find('<style id="bw-layer-map-css">'))
          if pos == -1:
              raise SystemExit('Map CSS block not found')
          s = s[:pos] + css + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V5/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "V5.5 make map layer button visible"
            git push
          fi
