name: V6 Hunt integration fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'V5/bw-v72-canonical-intelligence.js'
      - 'V5/bw-v73-hunt-autofill.js'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixes
        run: |
          node --check V5/bw-v72-canonical-intelligence.js
          node --check V5/bw-v73-hunt-autofill.js
      - name: Load fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="bw-v72-canonical-intelligence.js" data-bw-v72="1"></script>',
            '<script src="bw-v73-hunt-autofill.js" data-bw-v73="1"></script>'
          ]
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('No body close')
          for tag in reversed(tags):
            if tag not in s:
              s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet || git commit -m 'V6 load canonical Hunt fixes'
          git push
