name: V6 recommendation engine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v62-recommendation-integration.yml'
      - 'V5/bw-v62-recommendation-engine.js'
      - 'V5/bw-v63-today.js'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recommendation modules
        run: |
          node --check V5/bw-v62-recommendation-engine.js
          node --check V5/bw-v63-today.js
      - name: Load recommendation modules into V5
        shell: python
        run: |
          from pathlib import Path
          p=Path('V5/index.html')
          s=p.read_text(encoding='utf-8')
          tags='''<script src="bw-v62-recommendation-engine.js" data-bw-v62="1"></script>\n<script src="bw-v63-today.js" data-bw-v63="1"></script>'''
          if 'bw-v62-recommendation-engine.js' not in s:
              marker='<script src="bw-v56-pin-enhancements.js"'
              pos=s.find(marker)
              if pos<0: raise SystemExit('V5 enhancement insertion point not found')
              s=s[:pos]+tags+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V5/index.html
          git diff --cached --quiet || git commit -m 'V6 load hunt recommendation engine'
          git push
