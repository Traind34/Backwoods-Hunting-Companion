name: Backwoods Phase 1 Check

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find V5 -type f -name '*.js' -print0)
      - name: Validate JSON
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));" "$file"
          done < <(find V5 -type f -name '*.json' -print0)
      - name: Verify Phase 1 files
        shell: bash
        run: |
          set -e
          for file in \
            V5/index.html \
            V5/bw-v8-backwoods-suite.js \
            V5/bw-v8-bridge.js \
            V5/bw-v9-data-bridge.js \
            V5/bw-v10-phase1-integration.js \
            V5/bw-v11-field-data-contract.js \
            V5/bw-v12-seamless-sync.js \
            V5/bw-v13-intelligence-views.js \
            V5/bw-v14-field-dashboard.js \
            V5/bw-v15-camera-linker.js \
            V5/bw-v16-camera-canonical-sync.js \
            V5/bw-v17-legacy-live-sync.js
          do
            test -f "$file"
          done
      - name: Run canonical data regression test
        run: node V5/tests/phase1-contract.test.js
